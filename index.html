<html>
  <head>
    <style>
      html,
      body {
        margin: 0;
      }

      header {
        border-bottom: 1px solid grey;
        padding: 10px;
        text-align: right;
      }

      .container {
        width: 128px;
      }

      .container > video {
        width: 100%;
        border-radius: 100%;
        transform: rotateY(180deg);
      }

      .container > legend {
        text-align: center;
        background-color: sandybrown;
        margin-top: 5px;
        border-radius: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #context-menu {
        position: fixed;
        z-index: 100;
        width: 150px;
        background: #1b1a1a;
        border-radius: 5px;
        display: none;
      }

      #context-menu.visible {
        display: block;
      }

      #context-menu .item {
        padding: 8px 10px;
        font-size: 15px;
        color: #eee;
        cursor: pointer;
        border-radius: inherit;
      }

      #context-menu .item:hover {
        background: #343434;
      }
    </style>
  </head>
  <body>
    <header>
      <button>Disable Microphone</button>
      <select id="audioinput"></select>
      <button>Disable Speakers</button>
      <select id="audiooutput"></select>
      <button>Disable Camera</button>
      <select id="videoinput"></select>
    </header>

    <div id="context-menu">
      <div class="item" data-action="embed">Embed</div>
      <div class="item" data-action="text">Text</div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>

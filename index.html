<html>
  <head>
    <style>
      html,
      body {
        margin: 0;
      }

      header {
        border-bottom: 1px solid grey;
        padding: 10px;
        text-align: right;
      }

      .container {
        width: 128px;
      }

      .container > video {
        width: 100%;
        border-radius: 100%;
        transform: rotateY(180deg);
      }

      .container > legend {
        text-align: center;
        background-color: sandybrown;
        margin-top: 5px;
        border-radius: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <button>Disable Microphone</button>
      <select id="audioinput"></select>
      <button>Disable Speakers</button>
      <select id="audiooutput"></select>
      <button>Disable Camera</button>
      <select id="videoinput"></select>
    </header>

    <script src="./index.js"></script>
  </body>
</html>

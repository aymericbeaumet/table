name: outpost

on:
  push:
    branches: [master]
    paths: [outpost/**]

jobs:
  outpost:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outpost
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-go@v2
        with:
          go-version: '^1.16'

      - uses: actions/cache@v2
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - run: make ci
      - run: make build
      - run: make test
      - uses: golangci/golangci-lint-action@v2
        with:
          version: v1.41.1
          working-directory: outpost # TODO: this should already be using the default working directory
          skip-pkg-cache: true       # conflicts with actions/cache
          skip-build-cache: true     # conflicts with actions/cache

      # TODO: make deploy

---

- name: "Build ./cmd/{{goservice_name}}"
  local_action:
    module: ansible.builtin.shell
    chdir: "{{playbook_dir}}/.."
    cmd: "env GOOS=linux GOARCH=amd64 go build -o {{goservice_name}} ./{{goservice_source}}"

- name: Create configuration directory
  ansible.builtin.file:
    path: "/usr/local/etc/{{goservice_name}}"
    state: directory
    mode: '0755'

- name: Copy configuration files (aka hidden files)
  ansible.builtin.copy:
    src: "{{item}}"
    dest: "/usr/local/etc/{{goservice_name}}/"
  with_fileglob:
    - "{{playbook_dir}}/../{{goservice_source}}/.*"

- name: Create systemd service
  ansible.builtin.template:
    src: service.j2
    dest: "/etc/systemd/system/{{goservice_name}}.service"

- name: Copy binary
  ansible.builtin.copy:
    src: "{{playbook_dir}}/../{{goservice_name}}"
    dest: "/usr/local/bin/{{goservice_name}}.next"
    mode: '0755'

- name: Stop and enable systemd service
  ansible.builtin.systemd:
    name: "{{goservice_name}}"
    state: stopped
    enabled: yes

- name: Rename binary
  command: "mv /usr/local/bin/{{goservice_name}}.next /usr/local/bin/{{goservice_name}}"

- name: Start systemd service
  ansible.builtin.systemd:
    name: "{{goservice_name}}"
    state: started

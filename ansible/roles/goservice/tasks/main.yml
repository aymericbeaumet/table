---

- name: "Build {{goservice_name}} from ./{{goservice_source}}"
  local_action:
    module: ansible.builtin.shell
    chdir: "{{playbook_dir}}/.."
    cmd: "env GOOS=linux GOARCH=amd64 go build -o {{goservice_name}} ./{{goservice_source}}"

- name: "Create {{goservice_name}} group"
  ansible.builtin.group:
    name: "{{goservice_name}}"
    state: present

- name: "Create {{goservice_name}} user"
  ansible.builtin.user:
    name: "{{goservice_name}}"
    groups: "{{goservice_name}}"
    shell: /sbin/nologin
    home: "/usr/local/etc/{{goservice_name}}"
    comment: "account for the {{goservice_name}} service"
    state: present

- name: "Upload {{goservice_name}} configuration files"
  ansible.builtin.copy:
    src: "{{item}}"
    dest: "/usr/local/etc/{{goservice_name}}/"
    owner: "{{goservice_name}}"
    group: "{{goservice_name}}"
    mode: "0400"
  with_fileglob:
    - "{{playbook_dir}}/../{{goservice_source}}/.*"

- name: "Upload {{goservice_name}} binary"
  ansible.builtin.copy:
    src: "{{playbook_dir}}/../{{goservice_name}}"
    dest: "/usr/local/bin/{{goservice_name}}.next"
    owner: "{{goservice_name}}"
    group: "{{goservice_name}}"
    mode: "0700"

- name: "Update {{goservice_name}} service"
  ansible.builtin.template:
    src: service.j2
    dest: "/etc/systemd/system/{{goservice_name}}.service"
    mode: "0644"
  register: updateservice

- name: "Reload systemd daemon"
  ansible.builtin.systemd:
    name: "{{goservice_name}}"
    daemon_reload: yes
    state: stopped
  when: updateservice.changed

- name: "Stop {{goservice_name}} service"
  ansible.builtin.systemd:
    name: "{{goservice_name}}"
    state: stopped

- name: "Overwrite {{goservice_name}} binary"
  command: "mv /usr/local/bin/{{goservice_name}}.next /usr/local/bin/{{goservice_name}}"

- name: "Restart and enable {{goservice_name}} service"
  ansible.builtin.systemd:
    name: "{{goservice_name}}"
    state: restarted
    enabled: yes
